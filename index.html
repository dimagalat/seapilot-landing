<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quality Assurance &amp; Support Verification Platform | Sea Pilot</title>
<meta name="description" content="Catch product regressions before release and verify every support answer automatically. The AI-native quality operations platform for scaling B2B SaaS teams." />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,500,0..100,0..1;0,9..144,600,0..100,0..1;1,9..144,500,0..100,0..1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    /* Sea Pilot brand tokens (mirrored from branding-guide.html) */
    --ink: oklch(18% 0.03 220);
    --ink-2: oklch(26% 0.04 220);
    --ink-3: oklch(38% 0.03 220);
    --ink-4: oklch(58% 0.025 220);
    --paper: oklch(97% 0.012 85);
    --paper-2: oklch(93.5% 0.018 85);
    --paper-3: oklch(99% 0.008 85);
    --rule: oklch(85% 0.015 220);
    --rule-soft: oklch(90% 0.012 220);
    --beacon: oklch(58% 0.11 188);
    --beacon-deep: oklch(38% 0.09 198);
    --beacon-soft: oklch(90% 0.04 188);
    --signal: oklch(72% 0.17 58);
    --signal-soft: oklch(93% 0.05 65);
    --chart: oklch(68% 0.09 145);
    --port: oklch(55% 0.18 25);

    --font-display: 'Fraunces', 'Times New Roman', serif;
    --font-sans: 'Inter Tight', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;

    /* Density (overridden by Tweaks) */
    --pad-section: 140px;
    --pad-band: 96px;
    --pad-card: 32px;
  }

  /* Theme: paper (default) */
  body[data-theme="paper"] {
    --bg: var(--paper);
    --bg-2: var(--paper-2);
    --bg-3: var(--paper-3);
    --fg: var(--ink);
    --fg-2: var(--ink-2);
    --fg-3: var(--ink-3);
    --rule-bg: var(--rule);
  }
  /* Theme: ink (deep) */
  body[data-theme="ink"] {
    --bg: oklch(14% 0.03 220);
    --bg-2: oklch(20% 0.035 220);
    --bg-3: oklch(24% 0.04 220);
    --fg: oklch(96% 0.012 85);
    --fg-2: oklch(86% 0.02 220);
    --fg-3: oklch(70% 0.03 220);
    --rule-bg: oklch(34% 0.04 220);
  }

  body[data-density="tight"]  { --pad-section: 96px;  --pad-band: 72px;  --pad-card: 24px; }
  body[data-density="cozy"]   { --pad-section: 140px; --pad-band: 96px;  --pad-card: 32px; }
  body[data-density="spacious"] { --pad-section: 200px; --pad-band: 128px; --pad-card: 40px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    font-size: 15.5px;
    line-height: 1.55;
    transition: background 200ms ease, color 200ms ease;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  ::selection { background: var(--beacon); color: var(--ink); }

  .page { max-width: 1240px; margin: 0 auto; padding: 0 40px; }
  @media (max-width: 720px) { .page { padding: 0 22px; } }

  /* ---------- Nav ---------- */
  .nav {
    position: sticky;
    top: 0;
    z-index: 30;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    background: color-mix(in oklab, var(--bg) 78%, transparent);
    border-bottom: 1px solid color-mix(in oklab, var(--rule-bg) 70%, transparent);
  }
  .nav-inner {
    max-width: 1240px;
    margin: 0 auto;
    padding: 14px 40px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 32px;
  }
  @media (max-width: 720px) { .nav-inner { padding: 12px 22px; gap: 14px; } }
  .brand-mark { display: inline-flex; align-items: center; gap: 10px; }
  .brand-mark svg { display: block; }
  .brand-word { font-weight: 600; font-size: 16px; letter-spacing: -0.014em; }
  .brand-word em { font-style: normal; color: var(--beacon); font-weight: 600; }

  .nav-links { display: flex; gap: 28px; justify-content: center; }
  .nav-links a {
    font-size: 13.5px;
    color: var(--fg-2);
    transition: color 180ms ease;
  }
  .nav-links a:hover { color: var(--fg); }
  @media (max-width: 880px) { .nav-links { display: none; } }

  .nav-cta {
    display: flex; align-items: center; gap: 10px;
  }
  .nav-cta .ghost {
    font-size: 13.5px;
    color: var(--fg-2);
    padding: 8px 12px;
    border-radius: 6px;
    transition: background 160ms ease;
  }
  .nav-cta .ghost:hover { background: color-mix(in oklab, var(--rule-bg) 50%, transparent); color: var(--fg); }
  @media (max-width: 540px) { .nav-cta .ghost { display: none; } }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    font-family: var(--font-sans);
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: -0.005em;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform 120ms ease, background 160ms ease, border-color 160ms ease, color 160ms ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  body[data-theme="ink"] .btn-primary {
    background: var(--beacon);
    color: var(--ink);
    border-color: var(--beacon);
  }
  .btn-primary:hover { background: var(--beacon-deep); border-color: var(--beacon-deep); color: var(--paper); }
  body[data-theme="ink"] .btn-primary:hover { background: oklch(70% 0.13 188); border-color: oklch(70% 0.13 188); }

  .btn-ghost {
    background: transparent;
    color: var(--fg);
    border-color: var(--rule-bg);
  }
  .btn-ghost:hover { border-color: var(--fg); }

  .btn-lg { padding: 14px 22px; font-size: 15px; border-radius: 8px; }

  .arrow { transition: transform 200ms ease; }
  .btn:hover .arrow { transform: translateX(3px); }

  /* ---------- Hero ---------- */
  .hero {
    padding: clamp(80px, 12vh, 140px) 0 clamp(80px, 10vh, 120px);
    position: relative;
    overflow: hidden;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 64px;
    align-items: center;
  }
  @media (max-width: 980px) { .hero-grid { grid-template-columns: 1fr; gap: 48px; } }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--beacon-deep);
    margin-bottom: 28px;
  }
  body[data-theme="ink"] .eyebrow { color: var(--beacon); }
  .eyebrow::before { content: ''; width: 22px; height: 1px; background: currentColor; opacity: 0.65; }

  /* Normalize Fraunces — kill WONK; smaller opsz tames the flared F terminal at display sizes */
  .hero h1, .section-title, .vp-h, .path-h, .step .sh,
  .positioning blockquote, .cta-band h3, .cta-band .form-shell .s,
  .modal-head .h, .modal-success .h, .gauge .gv, .pm-card .cv, .pf-v {
    font-optical-sizing: auto;
    font-variation-settings: "opsz" 36, "SOFT" 50, "WONK" 0;
  }
  .hero h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(48px, 7.4vw, 96px);
    line-height: 0.96;
    letter-spacing: -0.035em;
    margin: 0 0 28px;
  }
  .hero h1 em { font-style: italic; color: var(--beacon-deep); font-weight: 500; }
  body[data-theme="ink"] .hero h1 em { color: var(--beacon); }

  /* Tone variant: declarative (sans, big) */
  body[data-tone="declarative"] .hero h1 {
    font-family: var(--font-sans);
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 0.94;
  }
  body[data-tone="declarative"] .hero h1 em { font-style: normal; }
  body[data-tone="declarative"] h2.section-title {
    font-family: var(--font-sans);
    font-weight: 600;
    letter-spacing: -0.035em;
  }
  body[data-tone="declarative"] h2.section-title em { font-style: normal; }

  /* Tone variant: operational */
  body[data-tone="operational"] .hero h1 {
    font-family: var(--font-sans);
    font-weight: 600;
    letter-spacing: -0.038em;
  }
  body[data-tone="operational"] .hero h1 em { font-style: normal; color: var(--signal); }
  body[data-tone="operational"] .eyebrow { color: var(--signal); }

  .hero-sub {
    font-size: clamp(17px, 1.4vw, 19px);
    line-height: 1.5;
    color: var(--fg-2);
    max-width: 540px;
    margin: 0 0 36px;
  }
  .hero-cta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .hero-meta {
    margin-top: 24px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-3);
    display: flex; gap: 24px; flex-wrap: wrap;
  }
  .hero-meta b { color: var(--fg); font-weight: 500; }

  /* ============== Hero visuals ============== */
  .hero-art {
    position: relative;
    aspect-ratio: 4/3.4;
    width: 100%;
  }

  /* Variant A: instrument panel (default) */
  .instr {
    position: relative;
    width: 100%;
    height: 100%;
    border: 1px solid var(--rule-bg);
    border-radius: 14px;
    background:
      radial-gradient(ellipse at 10% 0%, color-mix(in oklab, var(--beacon) 14%, transparent), transparent 55%),
      var(--bg-2);
    overflow: hidden;
    box-shadow: 0 30px 60px -30px color-mix(in oklab, var(--ink) 40%, transparent);
  }
  body[data-theme="ink"] .instr {
    background:
      radial-gradient(ellipse at 10% 0%, color-mix(in oklab, var(--beacon) 22%, transparent), transparent 55%),
      var(--bg-2);
  }
  .instr-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--rule-bg);
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-3);
  }
  .instr-head .dotrow { display: flex; gap: 6px; }
  .instr-head .dotrow span { width: 6px; height: 6px; border-radius: 50%; background: color-mix(in oklab, var(--rule-bg) 90%, transparent); }
  .instr-head .dotrow span.lit { background: var(--beacon); }
  .instr-body { padding: 22px 22px 0; display: grid; grid-template-rows: auto auto 1fr; gap: 16px; height: calc(100% - 41px); }

  .gauges {
    display: grid;
    grid-template-columns: 1.3fr 1fr 1fr;
    gap: 12px;
  }
  .gauge {
    border: 1px solid var(--rule-bg);
    border-radius: 8px;
    padding: 14px;
    background: var(--bg-3);
    display: flex; flex-direction: column; gap: 8px;
    min-height: 96px;
  }
  .gauge .gk {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-3);
  }
  .gauge .gv {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 30px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--fg);
  }
  body[data-tone="declarative"] .gauge .gv { font-weight: 600; }
  .gauge .gv em { color: var(--beacon-deep); font-style: italic; }
  body[data-theme="ink"] .gauge .gv em { color: var(--beacon); }
  .gauge .gd {
    font-size: 11px;
    color: var(--fg-3);
    display: flex; align-items: center; gap: 6px;
  }
  .gauge .delta {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--chart);
    padding: 1px 6px;
    border-radius: 99px;
    background: color-mix(in oklab, var(--chart) 14%, transparent);
  }
  .gauge.warn .delta { color: var(--signal); background: color-mix(in oklab, var(--signal) 16%, transparent); }

  .ticker {
    border: 1px solid var(--rule-bg);
    border-radius: 8px;
    background: var(--bg-3);
    overflow: hidden;
  }
  .ticker-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule-bg);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-3);
  }
  .ticker-head .live {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--chart);
  }
  .ticker-head .live .pulse {
    width: 6px; height: 6px; border-radius: 50%; background: var(--chart);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .ticker-rows { display: flex; flex-direction: column; }
  .trow {
    display: grid;
    grid-template-columns: 64px 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 10px 14px;
    border-top: 1px solid color-mix(in oklab, var(--rule-bg) 70%, transparent);
    font-size: 12.5px;
  }
  .trow:first-child { border-top: none; }
  .trow .tt {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--fg-3);
    letter-spacing: 0.04em;
  }
  .trow .tlbl {
    color: var(--fg);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .trow .tlbl b { font-weight: 500; }
  .trow .tt-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 99px;
    border: 1px solid var(--rule-bg);
    color: var(--fg-3);
  }
  .trow .tt-tag.pass { color: var(--chart); border-color: color-mix(in oklab, var(--chart) 40%, transparent); }
  .trow .tt-tag.warn { color: var(--signal); border-color: color-mix(in oklab, var(--signal) 50%, transparent); }
  .trow .tt-tag.fail { color: var(--port);   border-color: color-mix(in oklab, var(--port) 45%, transparent); }
  .trow .ts {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-2);
    font-variant-numeric: tabular-nums;
  }

  .instr-foot {
    margin-top: auto;
    padding: 10px 18px;
    border-top: 1px solid var(--rule-bg);
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-3);
  }

  /* Variant B: compass (brand abstract) */
  .compass-stage {
    position: relative;
    width: 100%; height: 100%;
    display: grid; place-items: center;
  }
  .compass-stage svg { width: min(100%, 460px); height: auto; }

  /* Variant C: dark wordmark */
  .wordmark-stage {
    width: 100%; height: 100%;
    background:
      radial-gradient(ellipse at 30% 30%, color-mix(in oklab, var(--beacon) 24%, transparent), transparent 55%),
      linear-gradient(160deg, oklch(22% 0.04 220), oklch(12% 0.03 220));
    border-radius: 14px;
    color: oklch(96% 0.012 85);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 36px;
    overflow: hidden;
    position: relative;
  }
  .wordmark-stage::after {
    content: ''; position: absolute; right: -80px; top: -80px;
    width: 280px; height: 280px;
    border: 1px dashed color-mix(in oklab, var(--beacon) 30%, transparent);
    border-radius: 50%;
  }
  .wordmark-stage .top {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.65;
  }
  .wordmark-stage .word {
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: clamp(64px, 9vw, 132px);
    line-height: 0.92;
    letter-spacing: -0.04em;
    margin: 0;
    position: relative;
  }
  .wordmark-stage .word em { color: var(--beacon); font-style: normal; font-weight: 600; }

  /* Variant D: product mock */
  .product-stage {
    position: relative;
    width: 100%; height: 100%;
    border: 1px solid var(--rule-bg);
    border-radius: 14px;
    overflow: hidden;
    background: var(--bg-2);
    box-shadow: 0 30px 60px -30px color-mix(in oklab, var(--ink) 40%, transparent);
  }
  .pm-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--rule-bg);
    background: var(--bg-3);
  }
  .pm-head .lights { display: flex; gap: 6px; }
  .pm-head .lights span { width: 10px; height: 10px; border-radius: 50%; background: color-mix(in oklab, var(--rule-bg) 90%, transparent); }
  .pm-head .url {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-3);
    background: var(--bg);
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--rule-bg);
    flex: 1;
  }
  .pm-body { padding: 16px; display: grid; grid-template-columns: 110px 1fr; gap: 14px; height: calc(100% - 41px); }
  .pm-rail { display: flex; flex-direction: column; gap: 4px; }
  .pm-rail .rl {
    font-size: 12px; padding: 7px 9px; border-radius: 5px; color: var(--fg-2);
    display: flex; align-items: center; gap: 8px;
  }
  .pm-rail .rl .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rule-bg); }
  .pm-rail .rl.active { background: color-mix(in oklab, var(--beacon) 14%, transparent); color: var(--fg); }
  .pm-rail .rl.active .dot { background: var(--beacon); }
  .pm-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .pm-card {
    border: 1px solid var(--rule-bg);
    border-radius: 8px;
    padding: 12px 14px;
    background: var(--bg-3);
  }
  .pm-card .ck { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 6px; }
  .pm-card .cv { font-family: var(--font-display); font-weight: 500; font-size: 22px; line-height: 1; letter-spacing: -0.02em; }
  body[data-tone="declarative"] .pm-card .cv { font-weight: 600; }

  /* ---------- Generic section header ---------- */
  .section { padding: var(--pad-section) 0; border-top: 1px solid var(--rule-bg); }
  .section:first-of-type { border-top: none; }

  .section-head {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 48px;
    margin-bottom: 64px;
    align-items: start;
  }
  @media (max-width: 880px) { .section-head { grid-template-columns: 1fr; gap: 16px; margin-bottom: 40px; } }
  .section-num {
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-3);
    padding-top: 14px;
    border-top: 2px solid var(--fg);
    width: max-content;
  }
  .section-title {
    font-family: var(--font-display);
    font-size: clamp(40px, 5.5vw, 72px);
    font-weight: 500;
    line-height: 0.98;
    letter-spacing: -0.03em;
    margin: 0 0 20px;
  }
  .section-title em { font-style: italic; color: var(--beacon-deep); font-weight: 500; }
  body[data-theme="ink"] .section-title em { color: var(--beacon); }
  .section-lede {
    font-size: 18px;
    line-height: 1.55;
    color: var(--fg-2);
    max-width: 620px;
    margin: 0;
  }

  /* ---------- VPs ---------- */
  .vps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    border-top: 1px solid var(--rule-bg);
    border-bottom: 1px solid var(--rule-bg);
  }
  @media (max-width: 980px) { .vps { grid-template-columns: 1fr; } }

  .vp {
    padding: var(--pad-card);
    border-right: 1px solid var(--rule-bg);
    display: flex; flex-direction: column; gap: 18px;
    position: relative;
  }
  .vp:last-child { border-right: none; }
  @media (max-width: 980px) {
    .vp { border-right: none; border-bottom: 1px solid var(--rule-bg); }
    .vp:last-child { border-bottom: none; }
  }
  .vp-num {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-3);
  }
  .vp-num b { color: var(--beacon-deep); font-weight: 500; margin-right: 8px; }
  body[data-theme="ink"] .vp-num b { color: var(--beacon); }

  .vp-h {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 32px;
    line-height: 1.04;
    letter-spacing: -0.024em;
    margin: 0;
  }
  body[data-tone="declarative"] .vp-h { font-weight: 600; letter-spacing: -0.025em; }

  .vp-promise {
    font-size: 15.5px;
    line-height: 1.5;

  /* ---------- How it works ---------- */
  .steps {

  /* ---------- Two paths (How it works) ---------- */
